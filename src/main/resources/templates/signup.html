<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Sign Up | InternHaul</title>

  <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family:
            Inter,
            Arial,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );
    }

    .card {
        width: 420px;
        padding: 36px;

        background: white;

        border-radius: 18px;

        box-shadow:
            0 20px 50px
            rgba(0, 0, 0, 0.08);
    }

    .logo {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 28px;
    }

    label {
        display: block;
        margin-bottom: 7px;

        font-size: 14px;
        font-weight: 600;
    }

    input {
        width: 100%;

        padding: 12px 14px;

        margin-bottom: 18px;

        border:
            1px solid #cbd5e1;

        border-radius: 9px;

        font-size: 14px;

        outline: none;
    }

    input:focus {
        border-color: #6366f1;
    }

    button {
        width: 100%;

        padding: 13px;

        border: none;

        border-radius: 9px;

        background: #4f46e5;

        color: white;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;
    }

    button:hover {
        background: #4338ca;
    }

    .error {
        padding: 10px 12px;

        margin-bottom: 18px;

        border-radius: 8px;

        background: #fee2e2;

        color: #b91c1c;

        font-size: 14px;
    }

    .login {
        text-align: center;

        margin-top: 20px;

        font-size: 14px;

        color: #64748b;
    }

    .login a {
        color: #4f46e5;
        font-weight: 600;
        text-decoration: none;
    }

    .role-note {
        padding: 12px;

        margin-bottom: 20px;

        border-radius: 8px;

        background: #f1f5f9;

        color: #475569;

        font-size: 13px;
    }

  </style>

</head>

<body>

<div class="card">

  <div class="logo">
    InternHaul
  </div>

  <div class="subtitle">
    Create your manager account
  </div>

  <div class="role-note">
    New accounts are registered as
    <strong>MANAGER</strong>.
    Administrator accounts can only be
    created by an existing administrator.
  </div>

  <div
          class="error"
          th:if="${error}"
          th:text="${error}">
  </div>

  <form
          th:action="@{/signup}"
          th:object="${signupRequest}"
          method="post">

    <label>
      Full Name
    </label>

    <input
            type="text"
            th:field="*{name}"
            placeholder="Enter your name"
            required>

    <label>
      Username
    </label>

    <input
            type="text"
            th:field="*{username}"
            placeholder="Choose a username"
            required>

    <label>
      Email
    </label>

    <input
            type="email"
            th:field="*{email}"
            placeholder="Enter your email"
            required>

    <label>
      Password
    </label>

    <input
            type="password"
            th:field="*{password}"
            placeholder="Minimum 8 characters"
            minlength="8"
            required>

    <button type="submit">
      Create Account
    </button>

  </form>

  <div class="login">
    Already have an account?
    <a href="/login">
      Login
    </a>
  </div>

</div>

</body>

</html>
